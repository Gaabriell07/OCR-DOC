name: Crear instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - '.streamlit/**'
      - 'packaging/**'
      - '.github/workflows/windows-installer.yml'
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Instalar herramientas de compilación
        shell: pwsh
        run: |
          choco install tesseract innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron instalar las herramientas.' }
          $target = "$env:ProgramFiles\Tesseract-OCR"
          if (-not (Test-Path "$target\tesseract.exe")) { throw 'No se encontro Tesseract.' }
          New-Item "$target\tessdata" -ItemType Directory -Force | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/spa.traineddata' -OutFile "$target\tessdata\spa.traineddata"
          New-Item "$target\licenses" -ItemType Directory -Force | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/LICENSE' -OutFile "$target\licenses\tessdata-fast-LICENSE.txt"
      - name: Compilar, instalar y comprobar el paquete
        shell: pwsh
        run: |
          $version = '0.1.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          ./packaging/build_windows.ps1 -Version $version
      - name: Pruebas del código en Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas.' }
      - name: Adjuntar código fuente y versiones
        shell: pwsh
        run: |
          $version = '0.1.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          git archive --format=zip --output="dist/installer/OCR-DOC-source-$version.zip" HEAD
          Copy-Item build/python-versions.txt dist/installer/
      - uses: actions/upload-artifact@v4
        with:
          name: OCR-DOC-Windows-x64
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OCR-DOC-Windows-x64
          path: installer
      - name: Publicar descarga en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" installer/* --clobber
          else
            gh release create "$RELEASE_TAG" installer/* --verify-tag --title "OCR DOC $RELEASE_TAG" --notes "Instalador Windows x64 con Python, OCR en español y accesos directos. Incluye código fuente y SHA256."
          fi
