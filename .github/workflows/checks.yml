name: Comprobar aplicación
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar OCR en español
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Instalar bibliotecas
        run: python -m pip install -r requirements.txt
      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Comprobar sintaxis
        run: python -m compileall -q app.py ocr_engine.py
